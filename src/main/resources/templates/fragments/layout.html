<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' - AiSafeCodeExporter'}">AiSafeCodeExporter</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark" th:fragment="nav">
    <div class="container page-shell">
        <a class="navbar-brand" th:href="@{/}">AiSafeCodeExporter</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/profiles}">Profiles</a>
            <a class="nav-link" th:href="@{/runs}">Run history</a>
            <a class="nav-link" th:href="@{/config/import-export}">Import/export</a>
        </div>
    </div>
</nav>
<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
