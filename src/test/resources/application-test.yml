server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:aisafecodesync-test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

logging:
  level:
    root: WARN
    com.inneo.aisafecodesync: INFO
