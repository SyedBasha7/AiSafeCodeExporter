name: AI-safe export profile
profileType: AI_SAFE_EXPORT
sourcePath: C:\demo\source\DemoCustomerPortal
targetPath: C:\demo\ai-safe-export\demo-customer-portal
includePatterns:
  - "**/*.java"
  - "**/*.jsp"
  - "**/*.xml"
  - "**/*.properties"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.json"
  - "**/*.sql"
  - "**/*.md"
  - "**/*.txt"
  - "**/*.html"
  - "**/*.css"
  - "**/*.js"
  - "**/*.ts"
  - "**/*.gradle"
  - "**/pom.xml"
  - "**/build.gradle"
  - "**/settings.gradle"
excludePatterns:
  - "**/target/**"
  - "**/build/**"
  - "**/out/**"
  - "**/.git/**"
  - "**/.idea/**"
  - "**/.settings/**"
  - "**/.vscode/**"
  - "**/node_modules/**"
  - "**/*.class"
  - "**/*.jar"
  - "**/*.war"
  - "**/*.ear"
  - "**/*.zip"
  - "**/.env"
  - "**/.env.*"
  - "**/*secret*"
  - "**/*credential*"
  - "**/*password*"
  - "**/*token*"
  - "**/*.jks"
  - "**/*.p12"
  - "**/*.pem"
  - "**/*.key"
  - "**/application-prod.yml"
  - "**/application-prod.properties"
allowTargetInsideSource: false
replacementRules:
  - id: project-name
    search: DemoCustomerPortal
    replacement: demo-app
    caseSensitive: true
    regex: false
    enabled: true
    applyTo:
      - DIRECTORY_NAME
      - FILE_NAME
      - FILE_CONTENT
  - id: tenant-name
    search: DemoTenant
    replacement: demo-tenant
    caseSensitive: true
    regex: false
    enabled: true
    applyTo:
      - FILE_CONTENT
sensitiveTermRules:
  - id: demo-sensitive-values
    values:
      - DemoCustomerPortal
      - DemoTenant
      - DemoProduction
    caseSensitive: true
    enabled: true
